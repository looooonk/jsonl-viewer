[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonl-cli"
version = "0.1.2"
description = "CLI JSONL viewer"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
jsonl = "jsonl_cli.cli:main"

[tool.setuptools]
packages = ["jsonl_cli"]

[tool.setuptools.package-data]
jsonl_cli = ["themes/*.json"]